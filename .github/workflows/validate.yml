name: FaithFlow Validation

on:
	push:
		branches: [ main, develop ]
	pull_request:
		branches: [ main, develop ]

jobs:
	validate:
		runs-on: ubuntu-latest

		services:
			postgres:
				image: postgres:15
				env:
					POSTGRES_USER: faithflow
					POSTGRES_PASSWORD: faithflow
					POSTGRES_DB: faithflow_test
				ports:
					- 5432:5432
				options: >-
					--health-cmd pg_isready
					--health-interval 10s
					--health-timeout 5s
					--health-retries 5

			redis:
				image: redis:alpine
				ports:
					- 6379:6379
				options: >-
					--health-cmd "redis-cli ping"
					--health-interval 10s
					--health-timeout 5s
					--health-retries 5

		steps:
			- uses: actions/checkout@v3

			- name: Setup Node.js
				uses: actions/setup-node@v3
				with:
					node-version: '18'

			- name: Install pnpm
				uses: pnpm/action-setup@v2
				with:
					version: 8

			- name: Get pnpm store directory
				id: pnpm-cache
				shell: bash
				run: |
					echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

			- name: Setup pnpm cache
				uses: actions/cache@v3
				with:
					path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
					key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
					restore-keys: |
						${{ runner.os }}-pnpm-store-

			- name: Install dependencies
				run: pnpm install

			- name: Setup environment
				run: |
					cp .env.example .env
					echo "DATABASE_URL=postgresql://faithflow:faithflow@localhost:5432/faithflow_test" >> .env
					echo "REDIS_URL=redis://localhost:6379" >> .env
					echo "NEXTAUTH_URL=http://localhost:3000" >> .env
					echo "NEXTAUTH_SECRET=test-secret" >> .env

			- name: Run validation script
				run: ./scripts/validate.sh

			- name: Upload test coverage
				uses: actions/upload-artifact@v3
				with:
					name: coverage
					path: coverage/

			- name: Check bundle size
				run: pnpm build
				env:
					CI: true

			- name: Run security audit
				run: pnpm audit

			- name: Check for type errors
				run: pnpm typecheck

			- name: Run linting
				run: pnpm lint

			- name: Run tests with coverage
				run: pnpm test --coverage

			- name: Upload coverage to Codecov
				uses: codecov/codecov-action@v3
				with:
					token: ${{ secrets.CODECOV_TOKEN }}
					files: ./coverage/coverage-final.json
					flags: unittests
					name: codecov-umbrella
					fail_ci_if_error: true
					verbose: true