name: Workspace Dependency Guard

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  workspace-dependency-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace dependencies
        run: pnpm lint:workspace-deps
